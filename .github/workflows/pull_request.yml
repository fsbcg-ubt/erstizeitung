on:
  pull_request:
    types: [opened, synchronize, reopened]

name: "GitHub Pages deployment for PRs"

env:
  PR_REPO_NAME: ${{ github.event.repository.name }}_${{ github.event.pull_request.node_id }}
  PR_COMMENT_TEXT_BEGIN: "Das Ergebnis des PRs kann unter "
  PR_COMMENT_TEXT_END: " eingesehen werden. 📖👀"

jobs:
  security_check:
    name: "Security Validation"
    runs-on: ubuntu-latest
    steps:
      - name: "Reject PRs from forks"
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::PRs from forks are not allowed to run this workflow for security reasons"
          exit 1

  detect_changes:
    name: "Detect File Changes"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      pwa: ${{ steps.filter.outputs.pwa }}
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: "Detect changed paths"
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            pwa:
              - 'pwa/**'
              - '.github/workflows/test-pwa.yml'
              - '.github/workflows/pull_request.yml'
              - '.github/workflows/release.yml'

  validate_csv:
    name: "Validate CSV Files"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: "Setup Python"
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - name: "Run CSV validation script"
        run: python .github/scripts/validate-csv-escaping.py

  create_repository:
    name: "Create PR Repository"
    runs-on: ubuntu-latest
    needs: [inject_pwa]
    if: always() && needs.inject_pwa.result == 'success'
    steps:
      - name: "Create new repository for temporary deployment"
        uses: f1lander/create-repository-action@790b25d255717b5a81416a8390f3344396181805
        with:
          name: ${{ env.PR_REPO_NAME }}
          org: "fsbcg-ubt"
          access-token: ${{ secrets.ORG_ADMIN_TOKEN }}

  test:
    name: "PWA Tests"
    needs: detect_changes
    if: needs.detect_changes.outputs.pwa == 'true'
    uses: ./.github/workflows/test-pwa.yml

  build_gitbook:
    name: "Render GitBook"
    runs-on: ubuntu-latest
    needs: validate_csv
    container:
      image: ghcr.io/fsbcg-ubt/docker-bookdown:0.4.4@sha256:537f8f31f39e6954ebf1c1a0d566d9f5b4114e3e7b40337a4e674bccaf032b31
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: "Render book as GitBook"
        run: Rscript -e "bookdown::render_book('index.Rmd', 'bookdown::gitbook')"
      - name: "Upload artifact"
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: _book_gitbook
          path: _book/

  inject_pwa:
    name: "Inject PWA Files"
    runs-on: ubuntu-latest
    needs: [detect_changes, test, build_gitbook]
    if: always() && needs.build_gitbook.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: "Setup Node.js"
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24.12.0'
          cache: 'npm'
          cache-dependency-path: 'pwa/package-lock.json'
      - name: "Download GitBook artifact"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: _book_gitbook
          path: _book
      - name: "Install Node.js dependencies"
        run: npm ci
        working-directory: pwa
      - name: "Compile TypeScript"
        run: npm run build:prod
        working-directory: pwa
      - name: "Generate PWA icons"
        run: npm run generate-icons
        working-directory: pwa
      - name: "Copy icons to _book"
        run: |
          mkdir -p _book/icons
          cp -r pwa/icons/* _book/icons/ 2>/dev/null || true
      - name: "Generate Service Worker"
        run: npx workbox-cli@7.3.0 generateSW dist/workbox-config.js
        working-directory: pwa
        env:
          BASE_PATH: /${{ env.PR_REPO_NAME }}
      - name: "Inject PWA files into HTML"
        run: node pwa/dist/inject-html.js
        env:
          BASE_PATH: /${{ env.PR_REPO_NAME }}
      - name: "Upload PWA-enabled artifact"
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: _book_pwa
          path: _book/

  deploy_gitbook:
    needs: [create_repository, inject_pwa, test]
    if: always() && needs.create_repository.result == 'success' && needs.inject_pwa.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    name: "Deploy GitBook to PR Repository"
    runs-on: ubuntu-latest
    environment:
      name: pull-request-staging
      url: https://fsbcg-ubt.github.io/${{ env.PR_REPO_NAME }}/
    steps:
      # https://github.com/actions/checkout#push-a-commit-using-the-built-in-token
      - name: "Set GitHub Actions as Commit Author"
        run: |
          git config --global user.name github-actions
          git config --global user.email github-actions@github.com
      - name: "Checkout PR Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: fsbcg-ubt/${{ env.PR_REPO_NAME }}
          token: ${{ secrets.ORG_ADMIN_TOKEN }}
      - name: "Download artifact"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: _book_pwa
      - name: "Push files to target"
        run: |
          touch .nojekyll
          git add .
          git commit -m $GITHUB_SHA
          git branch -M gh-pages
          git push -u origin gh-pages --force

  create_deployment_comment:
    needs: deploy_gitbook
    if: always() && needs.deploy_gitbook.result == 'success'
    name: "Create comment with GH Pages URL"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@450193c5abd4cdb17ba9f3ffcfe8f635c4bb6c2a
        with:
          github-token: ${{ secrets.ORG_ADMIN_TOKEN }}
          script: |
            const commentBody = "${{ env.PR_COMMENT_TEXT_BEGIN }}https://fsbcg-ubt.github.io/${{ env.PR_REPO_NAME }}/${{ env.PR_COMMENT_TEXT_END }}"

            let commentFound = false
            await github.paginate(github.rest.issues.listComments, {
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo
            })
            .then((comments) => {
              for (const comment of comments) {
                if (comment.body.includes("https://fsbcg-ubt.github.io/${{ env.PR_REPO_NAME }}")) {
                  commentFound = true
                }
              }
            })

            if (true == commentFound) {
              return
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            })