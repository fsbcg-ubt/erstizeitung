on:
  release:
    types: [published]

name: "Release as GitBook (with PWA)"

jobs:
  validate_csv:
    name: "Validate CSV Files"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: "Setup Python"
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - name: "Run CSV validation script"
        run: python .github/scripts/validate-csv-escaping.py

  test:
    name: "PWA Tests"
    uses: ./.github/workflows/test-pwa.yml

  build_gitbook:
    name: "Render GitBook"
    runs-on: ubuntu-latest
    needs: validate_csv
    container:
      image: ghcr.io/fsbcg-ubt/docker-bookdown:0.4.6@sha256:5730361c13840ca97b034a60f3cb1d870a983895938a23ff335945560af630da
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: "Render book as GitBook"
        run: Rscript -e "bookdown::render_book('index.Rmd', 'bookdown::gitbook')"
      - name: "Upload artifact"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: _book_gitbook
          path: _book/

  inject_pwa:
    name: "Inject PWA Files"
    runs-on: ubuntu-latest
    needs: [test, build_gitbook]
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: "Setup Node.js"
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.16.0'
          cache: 'npm'
          cache-dependency-path: 'pwa/package-lock.json'
      - name: "Download GitBook artifact"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: _book_gitbook
          path: _book
      - name: "Install Node.js dependencies"
        run: npm ci
        working-directory: pwa
      - name: "Compile TypeScript"
        run: npm run build:prod
        working-directory: pwa
      - name: "Generate PWA icons"
        run: npm run generate-icons
        working-directory: pwa
      - name: "Copy icons to _book"
        run: |
          mkdir -p _book/icons
          cp -r pwa/icons/* _book/icons/ 2>/dev/null || true
      - name: "Generate Service Worker"
        run: npx workbox-cli@7.3.0 generateSW dist/workbox-config.cjs
        working-directory: pwa
        env:
          BASE_PATH: /erstizeitung
      - name: "Inject PWA files into HTML"
        run: node pwa/dist/inject-html.js
        env:
          BASE_PATH: /erstizeitung
      - name: "Upload PWA-enabled artifact"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: _book_pwa
          path: _book/

  publish_gitbook:
      name: "Publish on GitHub Pages"
      runs-on: ubuntu-latest
      needs: [inject_pwa, validate_csv, test]
      steps:
        - name: "Checkout Repository"
          uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        - name: "Download artifact"
          uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
          with:
            name: _book_pwa
            path: _book
        - name: "Publish to GitHub Pages"
          uses: Cecilapp/GitHub-Pages-deploy@e1d24a95b0050d8d97ce8647409a3b0d8d01ebeb # 3.3.0
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          with:
            email: fs-bcg@uni-bayreuth.de
            build_dir: _book/

