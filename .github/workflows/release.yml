on:
  release:
    types: [published]

name: "Release as GitBook & PDF"

jobs:
  build_gitbook:
    name: "Render GitBook"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/fsbcg-ubt/docker-bookdown:0.4.2@sha256:118bd2468c7d30d24a85f9ffba86e8882a1fb99f499e452d7f0c485b4cfb1d51
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: "Render book as GitBook"
        run: Rscript -e "bookdown::render_book('index.Rmd', 'bookdown::gitbook')"
      - name: "Upload artifact"
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: _book_gitbook
          path: _book/

  publish_gitbook:
      name: "Publish on GitHub Pages"
      runs-on: ubuntu-latest
      needs: build_gitbook
      steps:
        - name: "Checkout Repository"
          uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        - name: "Download artifact"
          uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
          with:
            name: _book_gitbook
            path: _book
        - name: "Publish to GitHub Pages"
          uses: Cecilapp/GitHub-Pages-deploy@e1d24a95b0050d8d97ce8647409a3b0d8d01ebeb # 3.3.0
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          with:
            email: fs-bcg@uni-bayreuth.de
            build_dir: _book/

