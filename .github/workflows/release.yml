on:
  release:
    types: [published]

name: "Release as GitBook (with PWA)"

jobs:
  validate_csv:
    name: "Validate CSV Files"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: "Setup Python"
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14'
      - name: "Run CSV validation script"
        run: python .github/scripts/validate-csv-escaping.py

  test:
    name: "PWA Tests"
    uses: ./.github/workflows/test-pwa.yml

  build_gitbook:
    name: "Render GitBook"
    runs-on: ubuntu-latest
    needs: validate_csv
    container:
      image: ghcr.io/fsbcg-ubt/docker-bookdown:0.4.2@sha256:118bd2468c7d30d24a85f9ffba86e8882a1fb99f499e452d7f0c485b4cfb1d51
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: "Render book as GitBook"
        run: Rscript -e "bookdown::render_book('index.Rmd', 'bookdown::gitbook')"
      - name: "Upload artifact"
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: _book_gitbook
          path: _book/

  inject_pwa:
    name: "Inject PWA Files"
    runs-on: ubuntu-latest
    needs: [test, build_gitbook]
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: "Setup Node.js"
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '20.19.5'
          cache: 'npm'
          cache-dependency-path: 'pwa/package-lock.json'
      - name: "Download GitBook artifact"
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: _book_gitbook
          path: _book
      - name: "Install Node.js dependencies"
        run: npm ci
        working-directory: pwa
      - name: "Compile TypeScript"
        run: npm run build:prod
        working-directory: pwa
      - name: "Generate PWA icons"
        run: npm run generate-icons
        working-directory: pwa
      - name: "Copy icons to _book"
        run: |
          mkdir -p _book/icons
          cp -r pwa/icons/* _book/icons/ 2>/dev/null || true
      - name: "Generate Service Worker"
        run: npx workbox-cli@7.3.0 generateSW dist/workbox-config.js
        working-directory: pwa
        env:
          BASE_PATH: /erstizeitung
      - name: "Inject PWA files into HTML"
        run: node pwa/dist/inject-html.js
        env:
          BASE_PATH: /erstizeitung
      - name: "Upload PWA-enabled artifact"
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: _book_pwa
          path: _book/

  publish_gitbook:
      name: "Publish on GitHub Pages"
      runs-on: ubuntu-latest
      needs: [inject_pwa, validate_csv, test]
      steps:
        - name: "Checkout Repository"
          uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        - name: "Download artifact"
          uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
          with:
            name: _book_pwa
            path: _book
        - name: "Publish to GitHub Pages"
          uses: Cecilapp/GitHub-Pages-deploy@e1d24a95b0050d8d97ce8647409a3b0d8d01ebeb # 3.3.0
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          with:
            email: fs-bcg@uni-bayreuth.de
            build_dir: _book/

