<!DOCTYPE html><html lang="de"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Erstizeitung</title>
    <style>
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #249260 0%, #1e7a50 100%);
        color: white;
        text-align: center;
        padding: 20px;
      }
      .container {
        max-width: 500px;
      }
      h1 {
        font-size: 2.5em;
      }
      button {
        background: white;
        color: #249260;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  
    <link rel="manifest" href="/erstizeitung/manifest.json">
    <link rel="stylesheet" href="/erstizeitung/pwa-styles.css">
    <meta name="theme-color" content="#249260">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/erstizeitung/icons/icon-192.png"></head>
  <body>
    <div class="container" role="main">
      <div aria-hidden="true">📵</div>
      <h1>Keine Internetverbindung</h1>
      <p>
        Diese Seite ist offline nicht verfügbar. Bereits besuchte Seiten sind im
        Offline-Modus verfügbar.
      </p>
      <button onclick="window.history.back()" aria-label="Zurück zur vorherigen Seite">
        Zurück
      </button>
    </div>
  


    <script src="/erstizeitung/register-sw.js"></script>
    <script src="/erstizeitung/offline-indicator.js"></script>
    <script src="/erstizeitung/install-button.js"></script>
  </body></html>
